[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coegent-agent"
version = "0.1.0"
description = "Mission planner and deterministic mock robot runtime"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "coegent-executor-adapters>=0.1.0,<0.2",
                "langgraph>=1.2.16,<2", "langgraph-checkpoint-sqlite>=3.1.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
coegent = "coegent.cli:main"

[tool.setuptools.package-data]
coegent = ["schemas/*.json", "profiles/*.json"]
coegent_contracts = ["schemas/*.json"]

[tool.setuptools.packages.find]
include = ["coegent*"]
